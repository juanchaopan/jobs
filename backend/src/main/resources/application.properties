spring.application.name=jobs

ftp.host=${FTP_HOST}
ftp.port=${FTP_PORT}
ftp.user=${FTP_USER}
ftp.password=${FTP_PASSWORD}

# Let Hibernate update DB schema automatically on startup (creates tables if missing)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jackson.property-naming-strategy=KEBAB_CASE
