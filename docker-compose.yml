services:
  postgres:
    container_name: postgres
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - network

  ftp:
    container_name: ftp
    image: fauria/vsftpd
    restart: unless-stopped
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    environment:
      - FTP_USER=dev
      - FTP_PASS=dev
      - PASV_MIN_PORT=21100
      - PASV_MAX_PORT=21110
      - LOG_STDOUT=true
    volumes:
      - ./ftp_data:/home/vsftpd
    networks:
      - network

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - network

  agent:
    container_name: agent
    image: mcr.microsoft.com/devcontainers/typescript-node:bookworm
    volumes:
      - ./agent:/app
    user: node
    working_dir: /app
    command: sleep infinity
    networks:
      - network
    environment:
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=1000      
      - LANGUAGE_MODEL=gpt-5-nano
      - LANGUAGE_MODEL_BASE_URL=https://api.openai.com/v1
      - LANGUAGE_MODEL_API_KEY=${LANGUAGE_MODEL_API_KEY}
      # - LANGUAGE_MODEL=meta/llama-3.3-70b-instruct
      # - LANGUAGE_MODEL_BASE_URL=https://integrate.api.nvidia.com/v1
      # - LANGUAGE_MODEL_API_KEY=${NVIDIA_API_KEY}
      - VISION_MODEL=gpt-5-mini
      - VISION_MODEL_BASE_URL=https://api.openai.com/v1
      - VISION_MODEL_API_KEY=${VISION_MODEL_API_KEY}
      # - VISION_MODEL=stepfun-ai/step-3.7-flash
      # - VISION_MODEL_BASE_URL=https://integrate.api.nvidia.com/v1
      # - VISION_MODEL_API_KEY=${NVIDIA_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - DEVTOOLS_HOST=nginx
      - DEVTOOLS_PORT=9222
      - RESOURCE_PATH=C:/Users/juanc/AI Projects/jobs/ftp_data/dev
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_started

  backend:
    container_name: backend
    image: mcr.microsoft.com/devcontainers/java:25-bookworm
    volumes:
      - ./backend:/app:rw
    user: vscode
    working_dir: /app
    ports:
      - "8080:8080"
    command: sleep infinity
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/app
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - FTP_HOST=ftp
      - FTP_PORT=21
      - FTP_USER=dev
      - FTP_PASSWORD=dev
    networks:
      - network
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_started
      ftp:
        condition: service_started

  frontend:
    container_name: frontend
    image: mcr.microsoft.com/devcontainers/typescript-node:bookworm
    volumes:
      - ./frontend:/app
    user: node
    working_dir: /app
    ports:
      - "3000:3000"
    command: sleep infinity
    networks:
      - network
    environment:
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=1000
      - VITE_BACKEND_URL=
    depends_on:
      backend:
        condition: service_started

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

